# Count checks: the numbers upstream states, which the ledger must reproduce exactly.
#
# kind = "rows"     - the number in the description equals the number of ledger rows
#                     tagged with this check (`expected_rows`).
# kind = "asserted" - the number is a property a test must assert; tagged rows
#                     cover the behaviors but not one-for-one.
#
# Every check must be represented by at least one row, and the tagged rows must
# live on the same docs page as the check.

