# Count-check tagging.
#
# A count check names a set of items: the 32 system actions, the 46 built-in
# commands, the 15 placeholder forms. This file says which ledger rows those
# items are, so `cargo xtask parity` can check the number.
#
# A tag matches a row by page plus one of:
#   items               - rows whose behaviour begins with one of these subjects
#   heading             - every row under that heading
#   group / groups      - rows listed under that category
#   behavior_starts_with - rows whose behaviour begins with that text
#
# For a check with `kind = "rows"` the number of matched rows must equal
# `expected_rows`. For a check with `kind = "asserted"` the number is proven by
# a test named in the check's `evidence`, and the rows only record where the
# behaviour is documented.

