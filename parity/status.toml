# The port's own verdict on every generated row.
#
# The *scope* of the ledger is generated from upstream's documentation
# (`cargo xtask ledger`), because a hand-written list drifts from the docs.
# The *status* is written here by hand, because it is the port's own state and
# a regeneration must never lose it.
#
# A row is `PORTED` only when the cited evidence is a test that actually ran
# and shows the behavior the row describes. A row is `NOT PORTED` only with a
# one-line reason saying what is missing.
#
# The evidence is written as `crate::test_name`; the crate must exist in the
# workspace and the function must exist in its sources, or the ledger fails to
# validate.

