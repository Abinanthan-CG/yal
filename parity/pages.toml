# The canonical inventory of upstream documentation pages.
#
# `parity/parity.toml` is the source of truth for scope and status; this file is
# the source of truth for *which pages exist*, what each is called, and which
# tier it belongs to. `cargo xtask parity` validates every ledger row against
# it, and the page order here is the order pages appear in PARITY.md.
#
# page   - the upstream docs path, with a trailing slash
# title  - the page's display name
# tier   - 1 (must be 100% PORTED) or 2 (port as much as technically possible)
# source - the file downloaded from tinycast.dev that backs this page

[[page]]
page = "docs/launcher/"
windows = "\"Root search over apps, Windows Settings pages, commands, quicklinks, automations, snippets, system actions, window commands, layouts, rooms, custom commands, Quick Actions, extension commands and meetings. Section order, Suggestions rules, whole-category listing, the match-strength ladder, learned ranking (launcher-ranking.json) and search sensitivity port unchanged. App discovery: Start Menu shortcuts (user + all users), packaged apps from shell:AppsFolder (launched by AppUserModelID) and App Paths; these replace the /Applications default scopes. A scope is a folder, an .exe or a .lnk, searched one folder deep. The \"identifiers match only as typed, never by scattered letters\" rule applies to AppUserModelIDs and executable names, also matching without the publisher prefix. Localized names come from the shell with the English name still matching; alternate names come from shortcut and executable metadata (FileDescription, ProductName); CJK and Cyrillic names get the same Latin transliteration as upstream. App actions: Open, Show in File Explorer, favorites, Reset Ranking, Hide from Search, Restart / Quit / Force Quit (running apps only, same 5-second restart rule), Uninstall. Results can be dragged out (OLE drag-and-drop). A per-app global shortcut brings the app to the front and, pressed again, minimizes it."
title = "App launcher"
tier = 1
source = "upstream-docs/launcher.md"

[[page]]
page = "docs/launcher/favorites/"
windows = "\"Ctrl+1 ... Ctrl+9 and Ctrl+0 open favorites 1-10 by physical key position; holding Ctrl shows the numbers on the rows. Files and folders can be favorites while File Search is on. Selection-follows-favorite behavior, compact-mode behavior and learned-ranking rules unchanged."
title = "Favorites"
tier = 1
source = "upstream-docs/launcher/favorites.md"

[[page]]
page = "docs/launcher/aliases/"
windows = "\"Unchanged. One alias per entry, set on the item''s row in every Settings pane that lists launcher items; shown as a tag after the name; removed together with the thing it names."
title = "Aliases"
tier = 1
source = "upstream-docs/launcher/aliases.md"

[[page]]
page = "docs/launcher/fallbacks/"
windows = "\"Run Shell Command runs the typed text in PowerShell from the home folder with the user''s profile loaded, with output in the output window (Stop / Run Again). Open in Browser uses the default browser and appears at the top for URLs and bare domains. Fallback order and checkboxes are never part of a backup."
title = "Fallbacks"
tier = 1
source = "upstream-docs/launcher/fallbacks.md"

[[page]]
page = "docs/launcher/commands/"
windows = "\"Built-in command list unchanged apart from OS nouns. Custom commands run with no console window, under a pseudo-console so color and in-place progress bars work; stdin is closed; environment is inherited plus TINYCAST=1; working folder is Run In or the home folder; no timeout; the process tree survives the app quitting and Stop ends the whole tree (job object). Shell: PowerShell by default, with a per-command Shell field (PowerShell, cmd, Git Bash, WSL) as a Windows addition. Arguments are passed positionally and never spliced into the command text: $1...$n and $args in PowerShell, %1...%n in cmd, $1...$n in bash. Load shell environment means loading the PowerShell profile (off by default); upstream''s exit-code-127 hint maps to PowerShell''s command-not-found error. The output window keeps the last 256 KB, follows the tail, and shows result and duration; the failure dialog shows the last 8 KB. Command text is never written to logs. Raycast script-command import maps the same @raycast.* fields and resolves the shebang interpreter on Windows (python, node, bash via Git Bash or WSL), with a clear message when it is missing."
title = "Commands"
tier = 1
source = "upstream-docs/launcher/commands.md"

[[page]]
page = "docs/launcher/quicklinks/"
windows = "\"Destinations: local paths (~/Notes, drive-letter paths, UNC shares, file://), web pages, network schemes, app deeplinks and bare domains; keep upstream''s drive-letter and host:port rules. Open With saves a specific app; Open in a new window passes the browser''s new-window switch (Chrome, Edge, Firefox). {selection} reads the selected text of the previously focused app (UI Automation TextPattern, with a copy-and-restore clipboard fallback). Stored in quicklinks.sqlite3; the import/export JSON is identical to upstream so files move between macOS and Windows. Date formats use the same Unicode (TR35) patterns as upstream."
title = "Quicklinks"
tier = 1
source = "upstream-docs/launcher/quicklinks.md"

[[page]]
page = "docs/launcher/system-settings/"
windows = "\"Lists every Windows Settings page (ms-settings: URIs), Control Panel item and common management console, by localized name with the English name still matching. Second action: Show in File Explorer for file-backed items (.cpl, .msc), Copy URI for ms-settings: pages. Each row has a checkbox, a global shortcut recorder and an alias field."
title = "System Settings"
tier = 1
source = "upstream-docs/launcher/system-settings.md"

[[page]]
page = "docs/launcher/system-actions/"
windows = "\"All 32 actions, one to one. Session: Lock, Sleep, Sleep Displays, Restart, Shut Down, Log Out, Show Screen Saver. Media keys. Volume through the default playback device in 5% steps with the app''s own indicator (number, Muted instead of 0%, fades after 1.6 s). Show Desktop. Toggle System Appearance (apps and system light/dark). Toggle Stage Manager becomes Toggle Task View. Hide All Apps Except Frontmost minimizes every other window; Unhide All Hidden Apps restores them. Quit All Applications leaves Explorer and the app running and states the count. Dismiss Notifications clears the notification center. Open / Empty Trash act on the Recycle Bin, and the confirmation follows the Recycle Bin''s own display-delete-confirmation setting. Eject All Disks ejects removable and external drives only. Toggle Hidden Files flips the Explorer setting and refreshes open windows. Toggle Bluetooth uses the radio API. Toggle Microphone Mute acts on the default recording device. Result messages keep the changed / nothing-to-do distinction."
title = "System actions"
tier = 1
source = "upstream-docs/launcher/system-actions.md"

[[page]]
page = "docs/launcher/uninstall/"
windows = "\"Same screen and rules, translated. The app row runs the app''s registered uninstaller (Uninstall registry entries, MSI product, or package removal for packaged apps); portable apps go to the Recycle Bin. Leftovers are searched in %APPDATA%, %LOCALAPPDATA%, LocalLow, %PROGRAMDATA%, Start Menu / Desktop / Startup shortcuts and PATH shims, using the four matching rules translated: identifier or package family name, then publisher-product folder, then exact display name (labeled \"matched by name\"), and shims only when they point into the install folder. Leftover files go to the Recycle Bin, never permanent deletion. The app itself never elevates: rows that need administrator rights are locked; a vendor uninstaller may show its own UAC prompt and the confirmation says so. Never touched: anything directly in the user profile root, document folders, credential stores, drivers, and the app itself."
title = "Uninstall an app"
tier = 1
source = "upstream-docs/launcher/uninstall.md"

[[page]]
page = "docs/features/calculator/"
windows = "\"Pure logic: port all of it exactly. Port Tests/calc-test.swift case by case and turn every example row on the docs page into a test with the documented output (several hundred cases). Region, home currency and System number format come from Windows regional settings. Time zones use a bundled IANA database plus upstream''s extra city list, abbreviations and airport codes, and work offline. Use the same rate sources, 24-hour cache, manual refresh and 30-minute crypto retry as upstream. Calculator History is its own screen. The color card accepts hex, rgb() and hsl() and copies as hex, rgba(), hsl() and oklch()."
title = "Calculator"
tier = 1
source = "upstream-docs/features/calculator.md"

[[page]]
page = "docs/features/clipboard/"
windows = "\"Event-driven capture of text, images (saved as PNG), file lists and colors, keeping rich formats (HTML, RTF) so a normal paste differs from Paste as Plain Text. Honor Windows'' confidential-clipboard markers (ExcludeClipboardContentFromMonitorProcessing, CanIncludeInClipboardHistory) as the equivalent of copies that apps mark confidential; default excluded apps are installed password managers and credential dialogs. Pasting restores focus to the previous window and sends Ctrl+V (terminals receive the saved image path) and explains itself when the target is an administrator window. Text recognition runs in the OCR helper (files up to 32 MB, first 64 PDF pages). Rows can be dragged out. Stored in clipboard.sqlite3 with images beside it. The app''s own pastes are recognized and never recorded."
title = "Clipboard history"
tier = 1
source = "upstream-docs/features/clipboard.md"

[[page]]
page = "docs/features/snippets/"
windows = "\"Markdown files with the same optional frontmatter and validation messages; same placeholders, modifiers, nesting and loop rules. Keyword expansion uses a listen-only low-level keyboard hook; the buffer resets on app switch, modifier shortcuts, arrow keys, password or secure contexts and after 15 s without typing. Insertion ladder: UI Automation replace-and-verify, then typed input for single-line text up to 100 characters, then clipboard paste with exact clipboard restore that never appears in clipboard history. Status reads Off / Blocked / Active (Blocked replaces Needs Accessibility: the hook is unavailable or the front window is elevated). Folder watcher; save refuses on a conflict with the file on disk."
title = "Snippets"
tier = 1
source = "upstream-docs/features/snippets.md"

[[page]]
page = "docs/features/file-search/"
windows = "\"The app''s own index, not Windows Search: names, folders and dates only, built by a helper process and kept current with directory change notifications (plus the NTFS change journal when readable). Default scope is the user profile. Never hydrate cloud placeholders (OneDrive Files On-Demand): list them, do not download them, do not preview their contents. Full Disk Access becomes an access-status row: Ready, or the scoped folders that deny access. Default ignore patterns are translated (node_modules, .git, build output, AppData, caches, $Recycle.Bin ...). Share... opens the Windows share sheet; Copy File puts a real file drop on the clipboard; Move to Trash sends to the Recycle Bin without asking; the preview pane uses shell thumbnails and plays audio or video only on request. Turning the feature off deletes the index."
title = "File search"
tier = 1
source = "upstream-docs/features/file-search.md"

[[page]]
page = "docs/features/window-management/"
windows = "\"All 39 commands act on the window you were last using, computed against the monitor work area with DWM extended-frame-bounds compensation so tiled windows meet exactly. Gap 0-64 in steps of 2 device-independent pixels with the full-edge / half-edge rule. Shortcut presets Rectangle / Magnet and Spectacle are translated through the global modifier mapping. Toggle Fullscreen uses the window''s own fullscreen when it exposes one, otherwise app-managed borderless fullscreen with exact restore; it never sends F11. Switch to Previous / Next Space switches virtual desktops without animation (internal interface behind a trait, Win+Ctrl+Arrow fallback) and ignores presses that arrive mid-switch. Minimized, modal, cloaked and elevated windows follow the won''t-move rules."
title = "Window management"
tier = 1
source = "upstream-docs/features/window-management.md"

[[page]]
page = "docs/features/window-layouts/"
windows = "\"Unchanged semantics: an editor with per-display preview tabs, sizes as fractions of the work area, a 3x3 position grid, offsets, an optional argument (file, folder, web address or quicklink) and one Bring to front. Running: move open windows at once, launch missing apps and place each window as it appears (10 s in total), match by nearest position, skip windows for missing displays. Displays are identified by stable monitor identity, not by index."
title = "Window layouts"
tier = 1
source = "upstream-docs/features/window-layouts.md"

[[page]]
page = "docs/features/rooms/"
windows = "\"Same model: a named set of windows plus a layout. Entering a room arranges its windows on the current display with the chosen gap, minimizes apps that have no window in the room and parks the room apps'' other windows; nothing is ever closed. Original positions are written to disk before any move and restored on quit, when Window Management is turned off, and after a crash. The switcher previews the room over a blurred capture of the desktop. Keep the MIT attribution to Sara Gordic''s Rooms."
title = "Rooms"
tier = 1
source = "upstream-docs/features/rooms.md"

[[page]]
page = "docs/features/navigation/"
windows = "\"Switch Windows lists the Alt+Tab-eligible windows of every app across virtual desktops, grouped by app, minimized last; activating a window on another desktop switches to it. Hold-modifier cycling (press again to advance, release to switch) runs through the low-level hook, including when the user binds Alt+Tab itself. Hide Application minimizes that app''s windows. Search Menu Bar Items reads the foreground window''s menus without opening them: classic Win32 menus through the menu APIs, otherwise the UI Automation menu bar; it activates by command message or Invoke. Show Apple menu items becomes Show window menu items (Restore, Move, Size, Minimize, Maximize, Close). Apps without a menu bar get the documented explanation."
title = "Navigation"
tier = 1
source = "upstream-docs/features/navigation.md"

[[page]]
page = "docs/features/notes/"
windows = "\"One .md file per note in the app data folder or a folder the user chooses; no database, no frontmatter. A floating window whose height fits the note; live-formatted Markdown with raw symbols shown only on the caret line; every editor shortcut translated; the formatting bar; the switcher (120 ms pause, 200 results); autosave 300 ms after typing stops, with the same overwrite caveat and reload rules. Optional tray icon. Alt+F4 only hides the window. Switcher rows expose UI Automation actions (open, rename, move to Recycle Bin) for Narrator. Snippet keywords expand inside the editor and can be undone."
title = "Notes"
tier = 1
source = "upstream-docs/features/notes.md"

[[page]]
page = "docs/features/calendar/"
windows = "\"Events come from calendar providers behind one trait: ICS subscription URLs (read-only), CalDAV accounts, classic Outlook through COM when installed, and the Windows appointment store when accessible. Credentials live in Credential Manager and events are processed locally. Link detection order (URL, location, notes), the 10 known services, known-service priority and the ignore rules are unchanged; Zoom and Teams open their desktop apps through their protocol handlers when installed; Google Meet links carry the owning account. Join card with live countdown, Meetings section in search, My Schedule, Auto join and Camera preview all port. The calendar menu bar item is a separate tray icon (icon mode, or title mode with a live tooltip and a minutes badge) with the same menu; clicking the icon itself never joins. Create Event writes to the default writable calendar, or opens a pre-filled compose link when every source is read-only."
title = "Calendar & meetings"
tier = 1
source = "upstream-docs/features/calendar.md"

[[page]]
page = "docs/features/emoji/"
windows = "\"The full Unicode emoji and symbol set with color rendering. English names and keywords plus the 8 additional keyword languages (CLDR annotations), English matches first. Pins with reordering, Frequently Used (up to two rows), skin tone applied on paste, category filter with counts, 6-10 columns with zoom shortcuts. Pasting goes to the previously focused window and the footer names it."
title = "Emoji & symbols"
tier = 1
source = "upstream-docs/features/emoji.md"

[[page]]
page = "docs/features/dictation/"
windows = "\"Hold-to-talk or press-to-toggle, the capsule overlay with live level bars and a transcribing wave, the 5-minute cap, output volume ducked to a tenth while recording, start/stop sounds, smart spacing and capitalization from the text around the caret (UI Automation), and Insert while recording. Models run in the dictation helper process through ONNX Runtime (DirectML with CPU fallback), are downloaded on demand from Hugging Face with progress, cancel and remove, and are released from memory on the same timer. Use upstream''s model families and names wherever a Windows-runnable export exists; a model with no runnable export is NOT PORTED as its own row. The Dictation key section becomes: any special hardware key Windows reports (F13-F24, media and launch keys, the Copilot key) can be recorded, and its default action is suppressed only while bound."
title = "Dictation"
tier = 1
source = "upstream-docs/features/dictation.md"

[[page]]
page = "docs/features/dictionary/"
windows = "\"Windows has no system dictionary, so ship one: a bundled offline English dictionary with pronunciations under a redistributable license, plus user-installed dictionary packs (StarDict format) ordered in Settings; the first dictionary that knows the word answers. The entry shows word, pronunciation, parts of speech and numbered senses, all selectable. Open in Dictionary opens a standalone dictionary window showing the word in every enabled dictionary. Lookups never use the network."
title = "Define Word"
tier = 1
source = "upstream-docs/features/dictionary.md"

[[page]]
page = "docs/features/camera/"
windows = "\"Live preview through Media Foundation (or the webview camera API in a webview build). Take Photo copies a PNG to the clipboard and closes; Mirror flips preview and photo together and is remembered until quit; Switch Camera appears only with more than one device; clicking outside closes, except clicks on the taskbar, tray and Quick Settings. The camera is released the moment the preview closes."
title = "Camera"
tier = 1
source = "upstream-docs/features/camera.md"

[[page]]
page = "docs/features/apple-shortcuts/"
windows = "\"Becomes Automations: lists the user''s Power Automate Desktop flows (when installed) and Task Scheduler tasks from user-visible folders; runs them by name or global shortcut; tracks each by a stable identifier so alias, shortcut and favorite survive a rename and are cleaned up after deletion; re-reads the list whenever the launcher or the pane opens; closes the palette before running; shows nothing on success and Couldn''t Run with the last error lines on failure. Open Shortcuts becomes Open Power Automate and Open Task Scheduler. Off by default; needs no permission."
title = "Apple Shortcuts"
tier = 1
source = "upstream-docs/features/apple-shortcuts.md"

[[page]]
page = "docs/reference/settings/"
windows = "\"A regular resizable Settings window with the same 23 panes in four groups, the same defaults, and search by name and by related words. Renames only: Show in menu bar becomes Show in system tray; System Settings becomes Windows Settings; Apple Shortcuts becomes Automations; Hyper Key choices become Caps Lock or Left/Right Ctrl, Shift, Alt, Win; Secure Input Compatibility becomes Work over administrator windows. The Permissions pane shows what matters on Windows (administrator-window access, file index access, calendar providers, microphone, camera) with buttons to the right ms-settings: page. Languages: the same 9, generated from upstream''s Localizable.xcstrings."
title = "Settings"
tier = 1
source = "upstream-docs/reference/settings.md"

[[page]]
page = "docs/reference/shortcuts/"
windows = "\"Every row of all 19 tables gets exactly one Windows binding by the keyboard rules in the platform translation, recorded in docs/SHORTCUTS.md and enforced by a test. The dialog rule is unchanged: Enter presses the main button, Esc cancels, Cancel sits on the left."
title = "Keyboard shortcuts"
tier = 1
source = "upstream-docs/reference/shortcuts.md"

[[page]]
page = "docs/reference/hotkeys/"
windows = "\"The recorder widget with its live modifier bubble, conflict rejection that names the other action, Esc to stop and Backspace to clear. Modifier taps and double taps, side-aware, with upstream''s timings. Hyper key with the symbol display, Include Shift rewriting every saved shortcut, Quick Press (Caps Lock only), the status dot, Diagnostics... and Restart Hyper Key. Conflict detection is translated to PowerToys Keyboard Manager, AutoHotkey, registry Scancode Map remaps of Caps Lock and the Office key. Secure Input becomes administrator windows and the secure desktop: explain why Hyper cannot work there, name the app, and offer Work over administrator windows (relaunch elevated through a per-user scheduled task, consent once). Hiding versus turning off, and cleanup of shortcuts for deleted items, are unchanged."
title = "Hotkeys"
tier = 1
source = "upstream-docs/reference/hotkeys.md"

[[page]]
page = "docs/reference/deeplinks/"
windows = "\"Register the tinycast:// scheme per user; a second launch hands the link to the running instance without taking focus unless the link opens a screen. All link forms, the three parameters, bulk context lists, set-volume and window-size links work as documented. Links from other apps that carry input or act outside the app ask first (Always Allow / Run Once / Cancel, with Enter choosing Cancel); the allow list lives in Settings -> General -> Deeplinks and is never backed up. Copy Deeplink is offered everywhere upstream offers it. The Karabiner-Elements section becomes AutoHotkey and PowerToys examples; for apps and Settings pages point to start and ms-settings:."
title = "Deeplinks"
tier = 1
source = "upstream-docs/reference/deeplinks.md"

[[page]]
page = "docs/reference/backup/"
windows = "\"A single .tinycast file with the same five categories, chosen separately at export and at import; imports add rather than overwrite and always show a summary; Launcher Learning replaces. The never-enabled-by-import list and the not-included table apply unchanged. Settings-file sync at %USERPROFILE%/.config/tinycast/settings.json with the Import / Replace question and symlink preservation. Keep on-disk formats aligned with upstream so a macOS backup can be imported where its entries make sense on Windows, listing what was skipped (Windows addition)."
title = "Backup & restore"
tier = 1
source = "upstream-docs/reference/backup.md"

[[page]]
page = "docs/reference/import-from-raycast/"
windows = "\"Reads Raycast v2.0+ .rayconfig files with the passphrase; recognizes the file before asking, so a wrong passphrase is reported as a wrong passphrase. Imports the 11 categories; macOS shortcuts are translated by the import rule in the platform translation; app-bound items are matched to installed Windows apps by name and skipped when nothing matches. Importing never turns on keyword expansion; importing at least one quicklink turns Quicklinks on. Asks for quit-and-reopen afterwards; shows Quit Raycast while Raycast for Windows is running."
title = "Import from Raycast"
tier = 1
source = "upstream-docs/reference/import-from-raycast.md"

[[page]]
page = "docs/reference/updates/"
windows = "\"A daily check of GitHub Releases for the app''s own channel (first check 30 s after launch, retry after 2 h), a window with the release notes, download with progress and Cancel, verification, install, relaunch, and an Updated to ... notice. Verification: an Ed25519 (minisign-style) signature made in CI and checked against a public key compiled into the app, the matching Authenticode signer when the running build is signed, and product id and version checks. Per-user install, so there is never an administrator prompt. It waits while the user is busy (same conditions, retry every 2 minutes for half an hour, each version offered once per launch). Stable and beta are separate apps. winget and Scoop manifests replace the Homebrew section. Support opens the original author''s page: https://tinycast.dev/support."
title = "Updates"
tier = 1
source = "upstream-docs/reference/updates.md"

[[page]]
page = "docs/"
windows = "\"The welcome flow: pick the launcher shortcut (none is shipped; suggest Alt+Space), Launch at login, the paste explanation (an administrator-window note instead of Accessibility), optional Raycast import, Get Started. The same table of features that start off."
title = "Getting started"
tier = 2
source = "upstream-docs/docs-index.md"

[[page]]
page = "docs/palette/"
windows = "\"One floating palette shared by the launcher, search tools and Quick AI. Esc / Ctrl+Esc / Backspace navigation, the Tab cycle launcher -> Quick AI -> clipboard, screen stacking, Escape Key Behavior, Pop to Root delays, Compact and Expanded modes with up to four Compact Shortcuts, follow-the-cursor display choice, drag-to-move with snap guides, appearance, animations, interface size, auto-switching the input language while open, and the tray menu. This page is promoted to Tier 1 wherever the launcher depends on it."
title = "The palette"
tier = 2
source = "upstream-docs/palette.md"

[[page]]
page = "docs/permissions/"
windows = "\"The launcher needs nothing; ask only when a feature needs something, never at launch. Rewrite the page for Windows: administrator-window limits in place of Accessibility, camera and microphone privacy settings, calendar providers, radio access, and the list of things the app never needs."
title = "Permissions"
tier = 2
source = "upstream-docs/permissions.md"

[[page]]
page = "docs/install/"
windows = "\"Per-user installer .exe, portable zip, winget and Scoop. Stable and beta channels are separate apps with separate settings that run side by side. Uninstalling keeps user data unless the user chooses to remove it."
title = "Install"
tier = 2
source = "upstream-docs/install.md"

[[page]]
page = "docs/ai/"
windows = "\"Quick AI in the palette and the AI Chat window. Providers: API connections the user adds, installed CLIs (Codex, Claude, Grok, OpenCode, Cursor) where they exist on Windows, and a local on-device provider in place of Apple Intelligence when one is present. Chats in ai-chats.sqlite3, keys in Credential Manager, nothing AI-related in backups."
title = "AI Chat"
tier = 2
source = "upstream-docs/ai.md"

[[page]]
page = "docs/ai/quick-actions/"
windows = "\"Fix Grammar, Rewrite, Translate and Summarize on the selected text of any app, with Replace or Preview, custom actions and per-action models. The selection is read and replaced through UI Automation with a clipboard fallback."
title = "Quick Actions"
tier = 2
source = "upstream-docs/ai/quick-actions.md"

[[page]]
page = "docs/ai/mcp/"
windows = "\"Remote and local (stdio) MCP servers, OAuth sign-in, per-tool permission and the documented limits. Local servers start without console windows."
title = "MCP servers"
tier = 2
source = "upstream-docs/ai/mcp.md"

[[page]]
page = "docs/extensions/"
windows = "\"Raycast extensions run in a Node sidecar using upstream''s Scripts/raycast-runtime, adapted for Windows and rendered by this app''s own UI."
title = "Extensions"
tier = 2
source = "upstream-docs/extensions.md"

[[page]]
page = "docs/extensions/installing/"
windows = "\"The same four ways to install, and updates. The Automatic package-manager choice keeps upstream''s order (pnpm, then Bun, then Yarn, then npm), searching PATH and the usual Windows install locations (Volta, fnm, nvm-windows, Scoop, winget), plus custom search paths. Install scripts stay disabled, as upstream."
title = "Installing extensions"
tier = 2
source = "upstream-docs/extensions/installing.md"

[[page]]
page = "docs/extensions/customising/"
windows = "\"Preferences, launcher icon, command alias, background refresh and uninstalling, unchanged."
title = "Configuring an extension"
tier = 2
source = "upstream-docs/extensions/customising.md"

[[page]]
page = "docs/extensions/compatibility/"
windows = "\"Publish an honest Windows compatibility table: what works, and which APIs or extensions depend on macOS and therefore do not."
title = "What works"
tier = 2
source = "upstream-docs/extensions/compatibility.md"
