[[row]]
id = "launcher-uninstall.how-files-are-matched-to-the-app.bundle-identifier-an-exact-match-or-a-name-i"
page = "docs/launcher/uninstall/"
heading = "launcher-uninstall.how-files-are-matched-to-the-app"
behavior = "Bundle identifier. An exact match, or a name inside the app's own namespace. com.apple.iBooksX.CacheDelete belongs to com.apple.iBooksX, but com.apple.iBooksXtra doesn't. A dash also counts as a separator, so dev.zed.Zed-Preview.plist belongs to Zed, unless Zed Preview is also installed, in which case it belongs to Zed Preview. A short vendor prefix like com.adobe never claims everything under it."
