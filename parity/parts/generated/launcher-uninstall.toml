[[row]]
id = "launcher-uninstall.locked-rows.you-can-t-select-a-locked-row-from-most-to-l"
page = "docs/launcher/uninstall/"
heading = "launcher-uninstall.locked-rows"
behavior = "You can't select a locked row. From most to least important, a row is locked when the file is missing, protected by the system, locked by you in Get Info, only accessible with Full Disk Access, in a folder you can't write to, or owned by another user."
