page = "docs/features/window-management/"
heading = "features-window-management.how-sizes-are-calculated"
behavior = "Gaps. Edges next to the screen border get the full gap, and edges between two windows get half, so two windows side by side have exactly one gap between them, and every screen edge is inset by one gap. Edges are rounded so thirds never overlap or leave a one-point line between them."
