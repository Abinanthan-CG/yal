[[row]]
id = "ai-mcp.limits.use-25-by-default-or-10-50-100-or-unlimited"
page = "docs/ai/mcp/"
heading = "ai-mcp.limits"
behavior = "Use: 25 by default, or 10, 50, 100 or Unlimited. A model that keeps calling tools without answering is stuck, so when it reaches the limit, the reply ends with a note saying how many rounds it used. With Codex, the limit counts individual tool calls instead of rounds, which stops a runaway reply sooner. With Unlimited, a reply only ends when the model finishes, when you click Stop, or, on an API connection, when the tool history passes 1 MB. The reply keeps running while the palette is hidden or the window is closed, and every round is billed by your provider or counted against your plan."
