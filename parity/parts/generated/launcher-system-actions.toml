behavior = "Volume. Turn Volume Up and Turn Volume Down move in 5% steps: from 37%, up goes to 40% and down goes to 35%. Tinycast shows its own volume indicator, because macOS only shows one for the hardware media keys. It shows the level as a number, shows Muted instead of 0%, and fades out after 1.6 seconds."
