# Why a row is not ported, one line per page.
#
# The ledger's scope comes from upstream's documentation; this file says what
# is missing on Windows, so that a `NOT PORTED` row names the piece rather
# than shrugging.
#
# A row that *is* ported carries its own reason in `parity/status.toml`, so
# this file only speaks for the rows that have not been reached yet.

[page]
"docs/launcher/" = "The search and the program index are ported; the other sections — Windows Settings pages, quicklinks, snippets, system actions, window commands, layouts, rooms, custom commands, Quick Actions and meetings — have no entries yet."
"docs/launcher/favorites/" = "The number keys that open a favorite are ported in `tc-core`, but favorites have no store and no rows in the palette yet."
"docs/launcher/aliases/" = "An entry's alias is not stored, and the alias editor is not built yet."
"docs/launcher/fallbacks/" = "The fallback model is ported in `tc-core` — the built-ins, the quicklink fallback, the stored order and the section header — but the rows are not shown under the search and no fallback is run yet."
"docs/launcher/commands/" = "The 46 command identifiers are ported in `tc-core`, but no command is executed yet."
"docs/launcher/quicklinks/" = "Quicklinks have no store and no rows in the palette yet."
"The launcher lists the Windows Settings pages and opens the chosen one straight from the launcher, the way upstream lists the macOS System Settings panes."
"Twenty of the thirty-two actions run on Windows for real; the twelve that cannot - an absolute volume level, Stage Manager, the notification centre, ejecting a disk, the hidden-files toggle, the Bluetooth radio, the microphone - stay open with that reason."
"docs/launcher/uninstall/" = "The installer removes the program files and keeps the data; the in-app uninstaller and the per-application uninstall are not built yet."
"docs/features/calculator/" = "The arithmetic core and the whole unit table are ported in `tc-calc`, along with the conversions between two units and the mixed answers in two units of one kind; the currencies, the dates, the time zones, the percentages, the statistics, the history, the questions asked in words and the arithmetic that carries a unit are not."
"docs/features/clipboard/" = "The clipboard model layer is ported in `tc-clipboard` — the entry kinds, the filters, the colours, the capture policy, the Raycast import, the paste sequence and the store with its pins, its memory window and its retention — but the capture loop, the Windows clipboard watcher, the OCR of the copied images and the rows in the palette are not."
"docs/features/snippets/" = "The snippet record, the Markdown file format and the template engine are ported in `tc-snippets`, but there is no repository reading and writing the files, no keyword expansion, no editor, no browser and no rows in the palette yet."
"docs/features/file-search/" = "The file indexer helper exists, but the palette does not search the index yet."
"docs/features/window-management/" = "Windows can enumerate and move windows, but the launcher's window commands are not built yet."
"docs/features/window-layouts/" = "Window layouts have no store and no rows in the palette yet."
"docs/features/rooms/" = "Rooms are not implemented in YAL yet."
"Switching windows is built with Win32: every open window of every running app, brought to the front. Reading an app's menu bar has no Windows answer."
"docs/features/notes/" = "The note store has no editor and no rows in the palette yet."
"The calendar is built against Windows's own calendar through WinRT, and a command opens the web calendar. The macOS EventKit parts have no Windows answer."
"The model is ported in `tc-emoji` - the whole catalog of 2 136 emoji and symbols, the search with upstream's ranking, the pins, the frequency, the skin tones and the grid navigation - and the picker screen is the next thing. The localized keyword packs are not in upstream's repository."
"docs/features/dictation/" = "The dictation helper process exists, but the palette neither records nor transcribes yet."
"docs/features/dictionary/" = "The dictionary is not implemented in YAL yet."
"docs/features/camera/" = "The camera feature is not implemented in YAL yet."
"docs/features/apple-shortcuts/" = "Apple Shortcuts become Windows Automations, and the Automations index is not built yet."
"docs/reference/settings/" = "The settings file and the settings store are ported, but the settings window is not built yet."
"docs/reference/shortcuts/" = "The keyboard hook and the global shortcut are ported, but the shortcut editor is not built yet."
"docs/reference/hotkeys/" = "The global hotkey engine is ported, but the per-application hotkey registry is not built yet."
"docs/reference/deeplinks/" = "The `tinycast://` grammar is ported in `tc-core` and the protocol is registered, but a link is not acted on yet."
"docs/reference/backup/" = "Backing up and restoring the app's data is not built yet."
"docs/reference/import-from-raycast/" = "The Raycast import is not built yet."
"docs/reference/updates/" = "The update check is not built yet."
"The first-run story: YAL picks a shortcut of its own instead of leaving you without one, and asks what you want turned on."
"docs/palette/" = "The palette shows the search field, the results, the system actions and the calculator's answer; the colour card, the file rows and the other sections are not built yet."
"docs/permissions/" = "A per-user Windows install asks for no permissions beyond the ones Windows grants it; the accessibility permissions upstream needs have no Windows equivalent, and the rest of this page is not implemented."
"docs/install/" = "The installer, the portable build and the checksums are ported; the notarization, the Microsoft Store and the package-manager parts have no Windows answer yet."
"docs/ai/" = "No AI provider is wired up in YAL yet."
"docs/ai/quick-actions/" = "The Quick Actions feature is not implemented in YAL yet."
"docs/ai/mcp/" = "The MCP client is not implemented in YAL yet."
"docs/extensions/" = "YAL does not host extensions yet."
"docs/extensions/installing/" = "YAL does not host extensions yet, so there is nothing to install one from."
"docs/extensions/customising/" = "YAL does not host extensions yet, so there is nothing to customise."
"docs/extensions/compatibility/" = "YAL does not host extensions yet, so there is no compatibility to report."
