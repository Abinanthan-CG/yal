# YAL - a Windows keyboard launcher
#
# The installer is published with every release. This manifest points at the
# latest one.
#
# This is a template. `cargo xtask dist` fills in the checksums and the
# repository slug, and writes the result to `dist/packaging/winget/YAL.YAML`,
# which the release workflow uploads. A published release's artifacts are
# signed, so their checksums are only known once the release exists.
#
# To submit it:
#   1. Fork https://github.com/microsoft/winget-pkgs
#   2. Add this file under manifests/a/YAL/YAL/<version>/, with the
#      architecture subfolder
#   3. Open a pull request

PackageIdentifier: YAL.YAL
PackageVersion: {{VERSION}}
DefaultLocale: en-US

ManifestType: installer
ManifestVersion: 1.6.0

InstallerType: exe
NestedInstallerType: null
NestedInstallerFiles: null
ReleaseDate: {{RELEASE_DATE}}
Installers:
- Architecture: x64
  InstallerUrl: https://github.com/{{REPOSITORY}}/releases/download/v{{VERSION}}/yal-setup-{{VERSION}}-x64.exe
  InstallerSha256: {{INSTALLER_SHA256_X64}}
- Architecture: arm64
  InstallerUrl: https://github.com/{{REPOSITORY}}/releases/download/v{{VERSION}}/yal-setup-{{VERSION}}-arm64.exe
  InstallerSha256: {{INSTALLER_SHA256_ARM64}}

ManifestType: installer
ManifestVersion: 1.6.0

InstallerType: portable
InstallerUrl: https://github.com/{{REPOSITORY}}/releases/download/v{{VERSION}}/yal-{{VERSION}}-x64-portable.zip
InstallerSha256: {{PORTABLE_SHA256_X64}}
NestedInstallerType: portable
NestedInstallerFiles: yal.exe
PortableCommandAlias: yal
