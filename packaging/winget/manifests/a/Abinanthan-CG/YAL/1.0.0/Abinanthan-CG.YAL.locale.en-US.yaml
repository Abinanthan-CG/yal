ShortDescription: A fast, pure-Rust Win32 + Direct2D keyboard launcher for Windows 10 and 11.
Description: |-
  YAL (Yet Another Launcher) is a fast, lightweight native Windows keyboard launcher
  built in pure Rust on Win32, Direct2D, DirectWrite, and SQLite. Search apps, local files,
  clipboard history, snippets, emojis, open windows, quicklinks, quick notes, and run
  live calculations, unit conversions, and currency conversions without Electron or WebView2.
