[package]
name = "yal-cli"
description = "Headless command line front end for scripting, testing and automation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rc"
path = "src/main.rs"

[dependencies]
yal-core.workspace = true
yal-search.workspace = true
yal-calc.workspace = true
yal-store.workspace = true
yal-index.workspace = true
yal-data.workspace = true
yal-engine.workspace = true
yal-system.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
