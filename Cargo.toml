[workspace]
resolver = "3"
members = [
    "crates/yal-core",
    "crates/yal-engine",
    "crates/yal-search",
    "crates/yal-calc",
    "crates/yal-store",
    "crates/yal-index",
    "crates/yal-data",
    "crates/yal-system",
    "crates/yal-ui",
    "crates/yal",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/Abinanthan-CG/yal"
publish = false

[workspace.dependencies]
yal-core = { path = "crates/yal-core" }
yal-engine = { path = "crates/yal-engine" }
yal-search = { path = "crates/yal-search" }
yal-calc = { path = "crates/yal-calc" }
yal-store = { path = "crates/yal-store" }
yal-index = { path = "crates/yal-index" }
yal-data = { path = "crates/yal-data" }
yal-system = { path = "crates/yal-system" }
yal-ui = { path = "crates/yal-ui" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"
dirs = "6"
rand = "0.9"
egui = "0.32"
eframe = "0.32"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
