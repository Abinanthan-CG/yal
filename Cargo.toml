[workspace]
resolver = "2"
members = [
    "crates/tc-core",
    "crates/tc-search",
    "crates/tc-apps",
    "crates/tc-calc",
    "crates/tc-emoji",
    "crates/tc-snippets",
    "crates/tc-clipboard",
    "crates/tc-files",
    "crates/tc-windows",
    "crates/tc-backup",
    "crates/tc-platform",
    "crates/tc-platform-win",
    "crates/tc-commands",
    "crates/tc-palette",
    "crates/tc-ui",
    "apps/yal",
    "apps/yal-ui-probe",
    "xtask",
]

[workspace.package]
version = "1.0.1"
edition = "2021"
# The real floor, not a guess: `rusqlite` 0.41 declares Rust 1.89, and `libsqlite3-sys`
# 0.39 declares 1.88. The pinned toolchain is 1.99.1 (see rust-toolchain.toml).
rust-version = "1.89"
license = "AGPL-3.0-only"
authors = ["Abinanthan-CG", "YAL contributors"]
repository = "https://github.com/Abinanthan-CG/yal"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` keeps a persisted float exactly what it was, so a saved
# ranking reloads to the same score it had before it was written.
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.8"
toml_edit = "0.22"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `rusqlite` 0.41 bundles SQLite 3.54.0, which fixes RUSTSEC-2026-0459: a crafted
# database file with a mismatched `-wal` sibling could make SQLite hand back
# uninitialized page-cache memory. 0.32 bundled SQLite 3.45 and was affected.
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
regex = "1"
once_cell = "1"
parking_lot = "0.12"
smallvec = "1"
unicode-segmentation = "1"
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
jiff = "0.2"
icu = { version = "1", features = ["compiled_data"] }
url = "2"
percent-encoding = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = "2"
zstd = "0.13"
tar = "0.4"
flate2 = "1"
# `zip` 9.0.5 fixes RUSTSEC-2026-0548: a ZIP archive can name an entry twice - once in
# the local file header and once in the central directory - and a reader that uses the
# local names can write files under names a check never saw.
zip = { version = "9", default-features = false, features = ["deflate"] }
walkdir = "2"
globset = "0.4"
toml_datetime = "0.7"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
