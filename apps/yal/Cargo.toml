[package]
name = "yal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "YAL - a Windows keyboard launcher, an unofficial port of Tinycast"

[dependencies]
tc-apps = { path = "../../crates/tc-apps" }
tc-calc = { path = "../../crates/tc-calc" }
tc-core = { path = "../../crates/tc-core" }
tc-commands = { path = "../../crates/tc-commands" }
tc-files = { path = "../../crates/tc-files" }
tc-palette = { path = "../../crates/tc-palette" }
tc-platform = { path = "../../crates/tc-platform" }
tc-platform-win = { path = "../../crates/tc-platform-win" }
tc-windows = { path = "../../crates/tc-windows" }
tc-search = { path = "../../crates/tc-search" }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }