name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, without the leading v.
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rust_target: x86_64-pc-windows-msvc
            nsis_arch: x64
          - arch: arm64
            rust_target: aarch64-pc-windows-msvc
            nsis_arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the palette's dependencies
        run: npm ci
        working-directory: frontend

      - name: Build the palette
        run: npm run build
        working-directory: frontend

      - name: Build the release artifacts
        run: cargo run --quiet -p xtask -- dist --arch ${{ matrix.arch }}

      - name: Sign the binaries
        if: ${{ secrets.WINDOWS_CERTIFICATE_PFX != '' }}
        shell: pwsh
        run: |
          $pfx = [System.IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          & signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD dist\*.exe
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: The self-test passes
        run: ./target/${{ matrix.rust_target }}/release/yal.exe --self-test

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yal-${{ matrix.arch }}
          path: |
            dist/yal-setup-*-${{ matrix.arch }}.exe
            dist/yal-*-${{ matrix.arch }}-portable.zip
            dist/SHA256SUMS.txt

  sign:
    name: Sign the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Sign the checksums
        uses: mlugg/setup-minisign@v2
        with:
          secret-key: ${{ secrets.MINISIGN_SECRET_KEY }}
      - name: Sign
        run: |
          find artifacts -name '*.exe' -o -name '*.zip' | xargs minisign -Sm
          sha256sum artifacts/*/*.exe artifacts/*/*.zip artifacts/*/SHA256SUMS.txt > SHA256SUMS.txt || true
          minisign -Sm SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-signatures
          path: |
            artifacts
            SHA256SUMS.txt
            SHA256SUMS.txt.minisig

  publish:
    name: Draft the release
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            artifacts/*/*.exe
            artifacts/*/*.zip
            artifacts/*/SHA256SUMS.txt
            artifacts/release-signatures/*
          body_path: CHANGELOG.md
          generate_release_notes: true
