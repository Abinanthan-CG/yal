name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, without the leading v.
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    # GitHub does not hand the secrets to the `if` of a step, so the
    # certificate is put in the job's environment - where it is set before
    # any step runs - and the step looks for it there. An empty value means
    # there is no certificate, and the step is skipped rather than failing
    # the whole release.
    env:
      WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rust_target: x86_64-pc-windows-msvc
            nsis_arch: x64
          - arch: arm64
            rust_target: aarch64-pc-windows-msvc
            nsis_arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install the target we are building for
        run: rustup target add ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install NSIS
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -eq 0 -and (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
              exit 0
            }
            Write-Warning "NSIS install attempt $attempt failed; retrying in 5s..."
            Start-Sleep -Seconds 5
          }
          throw "NSIS installation failed after 3 attempts"

      # The ARM64 build needs the MSVC ARM64 compiler and linker. The runner
      # image usually carries it, but not always, and without it the link
      # fails with a message that says nothing about what to do. So it is
      # looked for, and installed only when it is genuinely missing.
      - name: Make sure the ARM64 build tools are there
        if: ${{ matrix.arch == 'arm64' }}
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installs = @(& $vswhere -all -products * -property installationPath)
          $found = $false
          foreach ($inst in $installs) {
            if (-not $inst) { continue }
            $msvc = Join-Path $inst 'VC\Tools\MSVC'
            if (-not (Test-Path $msvc)) { continue }
            $hit = Get-ChildItem -Path $msvc -Directory -ErrorAction SilentlyContinue |
              Where-Object { Test-Path (Join-Path $_.FullName 'bin\Hostx64\arm64\link.exe') }
            if ($hit) {
              Write-Host "ARM64 build tools found at $($hit[0].FullName)"
              $found = $true
              break
            }
          }
          if ($found) {
            exit 0
          }
          $installPath = & $vswhere -latest -products * -property installationPath
          if (-not $installPath) { throw "no Visual Studio installation was found" }
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          & $setup modify --installPath "$installPath" --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 --quiet --norestart --nocache
          if ($LASTEXITCODE -ne 0) { throw "installing the ARM64 build tools failed" }

      - name: Build the release artifacts
        run: cargo run --quiet -p xtask -- dist --arch ${{ matrix.arch }}

      # The signing step is skipped when there is no certificate.
      - name: Sign the binaries
        if: ${{ env.WINDOWS_CERTIFICATE_PFX != '' }}
        shell: pwsh
        run: |
          $pfx = [System.IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          & signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD dist\*.exe
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }

      - name: The self-test passes
        if: ${{ matrix.arch == 'x64' }}
        run: ./target/${{ matrix.rust_target }}/release/yal.exe --self-test

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yal-${{ matrix.arch }}
          path: |
            dist/yal-setup-*-${{ matrix.arch }}.exe
            dist/yal-*-${{ matrix.arch }}-portable.zip
          if-no-files-found: error

  sign:
    name: Checksum & sign the release
    needs: build
    runs-on: ubuntu-latest
    env:
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets and write SHA256SUMS.txt
        run: |
          mkdir -p release-assets
          cp artifacts/*/*.exe artifacts/*/*.zip release-assets/
          (cd release-assets && sha256sum *.exe *.zip > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt

      # The signature is a promise about the release. When there is no key
      # there is no signature, and the release still goes out - unsigned,
      # and saying so.
      - name: Sign the artifacts
        if: ${{ env.MINISIGN_SECRET_KEY != '' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          chmod 600 "$RUNNER_TEMP/minisign.key"
          cd release-assets
          for f in *.exe *.zip SHA256SUMS.txt; do
            minisign -S -s "$RUNNER_TEMP/minisign.key" -m "$f" < /dev/null
          done
          rm -f "$RUNNER_TEMP/minisign.key"

      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Draft the release
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release-assets

      - name: Extract latest release notes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          out, inside = [], False
          for line in lines:
              if line.startswith("## ["):
                  if inside:
                      break
                  inside = True
              if inside:
                  if line.startswith("### Earlier Development Notes"):
                      break
                  out.append(line)
          notes = "\n".join(out).strip() or Path("CHANGELOG.md").read_text(encoding="utf-8")
          Path("RELEASE_NOTES.md").write_text(notes + "\n", encoding="utf-8")
          PY

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release-assets/*
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
