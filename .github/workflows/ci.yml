name: CI

on:
  push:
    # Every branch, not just main: a branch that is being worked on should
    # be checked, and a branch is where work is developed before it lands.
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # A workflow file that GitHub cannot read does not run: the run turns red
  # in no time at all and has no jobs, and the reason is only in the run's
  # annotations. So the files are checked here, where the reason can be
  # printed.
  workflows:
    name: Workflow files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The workflow files are sound
        run: |
          python -m pip install --quiet pyyaml
          python ./scripts/check-workflows.py --self-test
          python ./scripts/check-workflows.py

  # The pure-logic crates build and test on any host, so a mistake in the
  # calculator or the snippet engine is caught in seconds rather than minutes.
  logic:
    name: Pure logic (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/tc-core crates/tc-calc crates/tc-search crates/tc-apps crates/tc-snippets crates/tc-platform
      - name: Test the pure-logic crates
        run: cargo test -p tc-core -p tc-platform -p tc-calc -p tc-search -p tc-apps -p tc-snippets
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p tc-core -p tc-platform -p tc-calc -p tc-search -p tc-apps -p tc-snippets --all-targets -- -D warnings

  frontend:
    name: Frontend (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the palette's dependencies
        run: npm ci
        working-directory: frontend
      - name: The palette's types are sound
        run: npm run check
        working-directory: frontend
      - name: The palette builds
        run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: yal-frontend-dist
          path: frontend/dist
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the palette
        run: npm ci
        working-directory: frontend
      - name: Build the palette
        run: npm run build
        working-directory: frontend

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: The parity ledger is current
        run: cargo run --quiet -p xtask -- parity --check

      - name: Check that every command in BUILD_WITH_AI.md works
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/check-build-with-ai.ps1 -SkipDist

      - name: No placeholders in shipped code
        shell: pwsh
        run: |
          $patterns = @('todo!', 'unimplemented!', 'unreachable!', 'TODO', 'FIXME', 'coming soon', 'mock data')
          $targets = @('crates', 'apps', 'frontend')
          $found = @()
          foreach ($pattern in $patterns) {
            $hits = Get-ChildItem -Path $targets -Recurse -Include *.rs,*.ts,*.tsx,*.js -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '\\(target|node_modules)\\' } |
              Select-String -Pattern $pattern -SimpleMatch
            $found += $hits
          }
          if ($found) {
            $found | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            throw "placeholders found in shipped code"
          }

      - name: Check the dependency licences
        run: |
          cargo install cargo-deny --locked
          cargo deny check

      - name: Build the release binaries
        run: cargo build --release --workspace

      - name: The self-test passes
        run: ./target/release/yal.exe --self-test

      - name: Build the installer and the portable zip
        run: cargo run --quiet -p xtask -- dist --arch x64

      - name: The installer smoke test
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/smoke-test.ps1

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: yal-windows-x64
          path: |
            dist/yal-setup-*-x64.exe
            dist/yal-*-x64-portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: ignore
