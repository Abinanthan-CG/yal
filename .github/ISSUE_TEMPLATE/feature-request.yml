name: Feature request
description: Something YAL should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        YAL is a port of [Tinycast](https://github.com/abue-ammar/tinycast).
        If the feature exists in Tinycast and is missing here, it is already
        tracked in [PARITY.md](https://github.com/OWNER/REPO/blob/main/PARITY.md)
        — please say which row it is, so it can be prioritised.

  - type: textarea
    id: what
    attributes:
      label: What would you like YAL to do?
      description: Describe the behaviour, not the implementation.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
    validations:
      required: true

  - type: textarea
    id: upstream
    attributes:
      label: Does Tinycast do this?
      description: |
        If Tinycast already does it, say so and link the page.
        The upstream documentation is at <https://tinycast.dev/docs>.
