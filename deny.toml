[graph]
all-features = false

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "ISC", "Unicode-3.0", "Zlib", "AGPL-3.0-only", "CC0-1.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
ignore = [
    # RUSTSEC-2026-0543: `chrono` is unmaintained; every version is affected and RustSec
    # records no safe upgrade. It is a maintenance risk, not a vulnerability.
    # Used in three call sites (tc-snippets template tokens, tc-clipboard RFC 3339 parsing,
    # xtask release date). Migrating to `jiff` or `time` is planned for 1.1.
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained with no safe upgrade. Three call sites only (tc-snippets template tokens, tc-clipboard RFC 3339 parsing, xtask release date). Migrating to jiff/time is planned for 1.1." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
